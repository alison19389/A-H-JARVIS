name: Build AH JARVIS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          rm -rf app
          mkdir -p app
          unzip -q AH-JARVIS-Android.zip -d app

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Encontrar projeto Gradle
        run: |
          echo "Procurando gradlew..."
          find app -name gradlew -type f -print

      - name: Compilar APK
        run: |
          GRADLEW=$(find app -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado dentro do projeto."
            exit 1
          fi

          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          find app -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AH-JARVIS-APK
          path: app/**/*.apk
